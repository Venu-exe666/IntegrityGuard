name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v7.0.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show runner environment
        run: python -c "import platform, sys; print(f'OS={platform.platform()}'); print(f'Python={sys.version}')"

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed package
        run: |
          python -m pip check
          python -c "import integrityguard; print(f'integrityguard={integrityguard.__version__}')"
          integrityguard --version
          integrityguard --help

      - name: Run test suite with skip reasons
        run: python -m pytest -v -ra
